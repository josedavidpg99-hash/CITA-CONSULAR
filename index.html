<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesoría Cita Consular — $5.99</title>
<style>
  :root{--verde:#006847;--blanco:#ffffff;--rojo:#CE1126;--txt:#1a1a1a;--mut:#6b7280;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--blanco);color:var(--txt);line-height:1.5;}
  .tricolor{display:flex;height:10px;}
  .tricolor div{flex:1;}
  .tricolor .v{background:var(--verde);}
  .tricolor .b{background:var(--blanco);border-bottom:1px solid #e5e7eb;}
  .tricolor .r{background:var(--rojo);}
  .wrap{max-width:520px;margin:0 auto;padding:56px 22px 60px;text-align:center;}
  .sello{display:inline-block;font-size:12px;letter-spacing:3px;font-weight:800;color:var(--verde);border:2px solid var(--verde);border-radius:999px;padding:7px 18px;margin-bottom:26px;}
  h1{font-size:34px;line-height:1.2;margin-bottom:14px;}
  h1 .rojo{color:var(--rojo);}
  .sub{font-size:19px;color:var(--txt);margin-bottom:8px;}
  .precio{font-size:56px;font-weight:800;color:var(--verde);margin:18px 0 30px;letter-spacing:-1px;}
  .precio small{font-size:20px;font-weight:700;vertical-align:super;}
  .paybtn{display:block;text-align:center;background:var(--verde);color:#fff;font-size:21px;font-weight:800;text-decoration:none;border-radius:18px;padding:20px;margin:0 0 14px;box-shadow:0 8px 22px rgba(0,104,71,.35);}
  .paybtn:active{transform:scale(.98);}
  .wa{display:block;text-align:center;background:#fff;color:var(--verde);border:2px solid var(--verde);font-weight:700;text-decoration:none;border-radius:18px;padding:15px;margin-top:6px;font-size:16px;}
  footer{margin-top:44px;color:var(--mut);font-size:12px;}
</style>
</head>
<body>

<div class="tricolor"><div class="v"></div><div class="b"></div><div class="r"></div></div>

<div class="wrap">
  <span class="sello">CONSULADO MEXICANO</span>
  <h1>¿No puedes conseguir <span class="rojo">cita consular</span>?</h1>
  <p class="sub">Nosotros te ayudamos por</p>
  <div class="precio"><small>$</small>5.99</div>

  <!-- PEGA AQUÍ EL PAYPAL PAYMENT LINK DE LA CUENTA DE TU ESPOSA -->
  <a class="paybtn" id="payBtn" href="PEGA-AQUI-EL-LINK-DE-PAYPAL">Pagar $5.99 ahora</a>
  <a class="wa" href="https://wa.me/13852302341?text=Hola%2C%20ya%20pagu%C3%A9%20mi%20asesor%C3%ADa%20de%20cita%20consular%20(%245.99).%20Mi%20nombre%20es%3A%20">Ya pagué — hablar con el asesor</a>

  <footer>Asesoría informativa.</footer>
</div>

</body>
</html>
